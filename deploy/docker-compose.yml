version: '3.8'

services:
  soc-backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    container_name: soc-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
      - "5514:5514/udp"   # Syslog UDP
      - "5515:5515/tcp"   # Syslog TCP
      - "5516:5516/tcp"   # WEF HTTP
      - "2055:2055/udp"   # NetFlow UDP
    environment:
      - PORT=5000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=soc_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - JWT_SECRET=cybermind_soc_super_secret_jwt_key_2026
    depends_on:
      postgres:
        condition: service_healthy

  soc-frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    container_name: soc-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - soc-backend

  postgres:
    image: postgres:16-alpine
    container_name: soc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: soc_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: soc-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:10.3.3
    container_name: soc-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana/dashboards:/var/lib/grafana/dashboards

volumes:
  postgres_data:
