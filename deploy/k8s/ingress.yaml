apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: soc-ingress
  namespace: soc-platform
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "soc-backend"
spec:
  rules:
    - host: soc.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: soc-frontend
                port:
                  number: 80
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: soc-backend
                port:
                  number: 5000
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: soc-backend
                port:
                  number: 5000
