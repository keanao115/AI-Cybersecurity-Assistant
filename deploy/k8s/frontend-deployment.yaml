apiVersion: apps/v1
kind: Deployment
metadata:
  name: soc-frontend
  namespace: soc-platform
  labels:
    app: soc-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: soc-frontend
  template:
    metadata:
      labels:
        app: soc-frontend
    spec:
      containers:
        - name: soc-frontend
          image: soc-platform/frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: soc-frontend
  namespace: soc-platform
spec:
  type: ClusterIP
  selector:
    app: soc-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
